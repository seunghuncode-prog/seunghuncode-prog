  </defs>
  <rect width="1120" height="350" fill="#f3eddf"/>
  <rect width="1120" height="350" fill="url(#paper)"/>
  <rect x="16" y="16" width="1088" height="318" fill="none" stroke="#c2b49d" stroke-width="0.8"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#3e382f">
