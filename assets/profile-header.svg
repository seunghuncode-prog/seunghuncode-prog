<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
  <title id="title">Seung Hun Ji — Notes and Experiments</title>
  <desc id="desc">An ivory and brown notebook masthead with serif typography and a hand-drawn style network diagram.</desc>
  <defs>
    <pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="3" r="0.45" fill="#9c896f" opacity="0.12"/>
      <circle cx="6" cy="7" r="0.35" fill="#9c896f" opacity="0.09"/>
    </pattern>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
