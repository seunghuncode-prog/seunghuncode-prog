    <text x="48" y="46" font-family="'Courier New', monospace" font-size="13" letter-spacing="2.2" fill="#766651">NOTES &amp; EXPERIMENTS</text>
    <text x="1072" y="46" text-anchor="end" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.4" fill="#766651">SEOUL, SOUTH KOREA</text>
    <text x="48" y="166" font-size="79" letter-spacing="-2.6">Seung Hun Ji<tspan fill="#95634f">.</tspan></text>
    <text x="51" y="210" font-size="24" font-style="italic" fill="#71614d">An inquiry into data &amp; intelligence.</text>
    <path d="M51 246H100" fill="none" stroke="#95634f" stroke-width="2"/>
    <text x="115" y="251" font-family="'Courier New', monospace" font-size="14" letter-spacing="1.1" fill="#645d4f">DATA SCIENCE / MACHINE LEARNING / AI</text>
    <path d="M48 295H1072M48 300H1072" fill="none" stroke="#8b7760" stroke-width="0.7"/>
    <text x="48" y="319" font-family="'Courier New', monospace" font-size="11" letter-spacing="1.3" fill="#766651">KWANGWOON UNIVERSITY</text>
    <text x="1072" y="319" text-anchor="end" font-family="'Courier New', monospace" font-size="11" letter-spacing="1.3" fill="#766651">LEARNING, ONE QUESTION AT A TIME.</text>
  </g>
  <g transform="translate(820 85)">
